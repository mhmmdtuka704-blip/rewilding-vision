[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rewilding-vision"
version = "0.2.0"
description = "Spatially checked vegetation change: SegFormer transfer learning, ExG, and GeoTIFF exports"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "LicenseRef-Proprietary"
authors = [{name = "mhmmdtuka704-blip"}]
keywords = ["vegetation", "computer-vision", "semantic-segmentation", "geotiff", "change-detection"]
dependencies = [
  "numpy>=2,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "streamlit>=1.57,<2",
  "opencv-python-headless>=4.10,<5",
  "torch>=2.6,<3",
  "transformers>=4.45,<5",
  "safetensors>=0.4,<1",
  "rasterio>=1.4,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/mhmmdtuka704-blip/rewilding-vision"
Issues = "https://github.com/mhmmdtuka704-blip/rewilding-vision/issues"

[project.scripts]
rewilding-analyze-pair = "rewilding_vision.cli:analyze_pair_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
